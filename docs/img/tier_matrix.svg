      .feature-cell { fill: #161b22; stroke: #30363d; stroke-width: 1; }
      .cell-yes { fill: #161b22; stroke: #30363d; stroke-width: 1; }
      .cell-no { fill: #161b22; stroke: #30363d; stroke-width: 1; }
      .text-header { fill: #58a6ff; font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; font-weight: 700; text-anchor: middle; }
      .text-tier { fill: #e6edf3; font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; font-weight: 600; text-anchor: middle; }
      .text-feature { fill: #e6edf3; font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; text-anchor: start; dominant-baseline: middle; }
      .text-yes { fill: #3fb950; font-family: 'Segoe UI', system-ui, sans-serif; font-size: 16px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
      .text-no { fill: #484f58; font-family: 'Segoe UI', system-ui, sans-serif; font-size: 16px; font-weight: 400; text-anchor: middle; dominant-baseline: middle; }
      .text-sub { fill: #8b949e; font-family: 'Segoe UI', system-ui, sans-serif; font-size: 10px; text-anchor: middle; }
      .legend-text { fill: #e6edf3; font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; }
      @media (prefers-color-scheme: light) {
        .bg { fill: #ffffff; }
        .header-cell, .tier-cell, .feature-cell, .cell-yes, .cell-no { fill: #f6f8fa; stroke: #d0d7de; }
        .text-header { fill: #0969da; }
        .text-tier, .text-feature { fill: #24292f; }
        .text-yes { fill: #1a7f37; }
        .text-no { fill: #969696; }
        .text-sub { fill: #656d76; }
        .legend-text { fill: #24292f; }
