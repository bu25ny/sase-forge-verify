    <text x="315" y="372" class="text-no">❌</text>
    <rect x="360" y="350" width="90" height="45" class="cell-no"/>
    <text x="405" y="372" class="text-no">❌</text>
    <rect x="450" y="350" width="90" height="45" class="cell-yes"/>
