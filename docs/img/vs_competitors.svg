<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .header-bg { fill: #161b22; stroke: #30363d; stroke-width: 1; }
      .cell-bg { fill: #161b22; stroke: #30363d; stroke-width: 1; }
      .cell-sase { fill: #0d2818; stroke: #30363d; stroke-width: 1; }
      .text-header { fill: #58a6ff; font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; font-weight: 700; text-anchor: middle; }
      .text-feature { fill: #e6edf3; font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; text-anchor: start; dominant-baseline: middle; }
      .text-competitor { fill: #e6edf3; font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; font-weight: 600; text-anchor: middle; }
      .text-sase { fill: #e6edf3; font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; font-weight: 700; text-anchor: middle; }
      .text-yes { fill: #3fb950; font-family: 'Segoe UI', system-ui, sans-serif; font-size: 18px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
      .text-no { fill: #484f58; font-family: 'Segoe UI', system-ui, sans-serif; font-size: 18px; font-weight: 400; text-anchor: middle; dominant-baseline: middle; }
      .text-title { fill: #58a6ff; font-family: 'Segoe UI', system-ui, sans-serif; font-size: 16px; font-weight: 700; text-anchor: middle; }
      .text-sub { fill: #8b949e; font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; text-anchor: middle; }
      .legend-text { fill: #e6edf3; font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; }
      .check { fill: #3fb950; }
      .cross { fill: #484f58; }
      @media (prefers-color-scheme: light) {
        .bg { fill: #ffffff; }
        .header-bg, .cell-bg { fill: #f6f8fa; stroke: #d0d7de; }
        .cell-sase { fill: #dafbe1; stroke: #d0d7de; }
        .text-header { fill: #0969da; }
        .text-feature, .text-competitor, .text-sase { fill: #24292f; }
        .text-yes { fill: #1a7f37; }
        .text-no { fill: #969696; }
        .text-title { fill: #0969da; }
        .text-sub { fill: #656d76; }
        .legend-text { fill: #24292f; }
        .check { fill: #1a7f37; }
        .cross { fill: #969696; }
