    <rect x="380" y="320" width="100" height="40" class="cell-bg"/>
    <text x="430" y="340" class="text-no cross">❌</text>
    
    <rect x="480" y="320" width="100" height="40" class="cell-bg"/>
    <text x="530" y="340" class="text-yes check">✅</text>
    
    <rect x="580" y="320" width="100" height="40" class="cell-bg"/>
    <text x="630" y="340" class="text-yes check">✅</text>
    
    <!-- Row 9: Formal verify -->
    <rect x="0" y="360" width="180" height="40" class="cell-bg"/>
