  <!-- Legend at bottom -->
  <text x="400" y="395" class="text-sub" style="font-size: 10px;">SASE Forge Verify: Community (Free) · Scientific (Paid - ML policies, anomaly detection, HSM) · Government (Paid - Formal verification, classified HSM)</text>
